  <script>
    // 1. Array containing the file paths or URLs of your background images
    const images = [
        'images/guit.jpg',
        'images/bunny.JPG',
        'images/haverhill.png',
        'images/machine.JPG',
        'images/collective.png',
        'stsimons/img- (139).JPG',
        'montreal/img- (72).JPG',
    ];

    let currentIndex = 0;

    // 2. Function to update the body background image
    function changeBackground() {
        // Apply the current image from the array to the CSS background-image property
        document.body.style.backgroundImage = `url('${images[currentIndex]}')`;
        
        // Advance to the next image index, looping back to 0 at the end of the array
        currentIndex = (currentIndex + 1) % images.length;
    }

    // 3. Initialize the first image immediately on page load
    changeBackground();

    // 4. Listen for the space bar keypress to trigger changeBackground
    window.addEventListener('keydown', function(event) {
        // Check if the pressed key is the Space bar
        if (event.code === 'Space' || event.key === ' ') {
            // Prevent the default behavior (like scrolling down the page)
            event.preventDefault(); 
            // Change the image
            changeBackground();
        }
    });
</script>
